<!DOCTYPE html>
<html lang="en"  data-bs-theme="light">

<body class="d-flex min-vh-100 text-center text-bg-dark">
{% include "head.html" %}
<div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column" style="padding-top: 84px;">
  <div class="side-bar left-bar"
     style="position:fixed; top:80px; bottom:0; left:20px; width:200px; z-index:0;pointer-events:none;opacity:0.5;">
  <img src="static/assets/side-one.webp"
       style="width:100%; height:100%; object-fit:cover;">
</div>

<div class="side-bar right-bar"
     style="position:fixed; top:80px; bottom:0; right:20px; width:200px; z-index:0;pointer-events:none;opacity:0.5;">
  <img src="static/assets/side-two.webp"
       style="width:100%; height:100%; object-fit:cover;">
</div>



<div class="container">
  <h1 class="heading">My Top Movies</h1>
  <p class="description">These are my all-time favourite movies.</p>
{% for movie in movies %}
  <div class="card" >
    <div class="front" style="background-image:url({{movie.img_url}})">
        <p class="large">{{movie.ranking}}</p>
    </div>
    <div class="back">
      <div>
    <div class="title"> {{movie.title}} <span class="release_date"> ({{movie.year}}) </span></div>
        <div class="rating">
            <label>{{movie.rating}}</label>
          <i class="fas fa-star star"></i>
        </div>
          <p class="review">{{movie.review}}</p>
        <p class="overview">
            {{movie.description}}
        </p>


<a href="{{ url_for('movies.edit',movie_name=movie.title, movie_id=movie.id)}}" class="btn btn-outline-success">Update</a>
          <form action="{{url_for('movies.delete',movie_id=movie.id)}}" method="POST">
      {{ delete_form.hidden_tag() }}<button type="submit"  class="btn btn-outline-danger">Delete</button>



</form>
      </div>
    </div>
  </div>

    {% endfor %}
</div>
<div class="container text-center add">
<a href="{{url_for('movies.add')}}" class="btn btn-outline-warning">Add Movie</a>
</div>


    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />

    {% include "footer.html" %}</div>
</body>
</html>
